<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#171029" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>璀璨宝石</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="conn-badge" class="hidden">连接中断,正在重连…</div>

  <!-- 大厅 -->
  <section id="screen-lobby" class="screen">
    <header class="brand">
      <div class="brand-gems">
        <span class="gem g-white"></span><span class="gem g-blue"></span><span class="gem g-green"></span><span class="gem g-red"></span><span class="gem g-black"></span>
      </div>
      <h1>璀璨宝石</h1>
      <p class="brand-sub">SPLENDOR · 和朋友在线开一局</p>
    </header>

    <div class="card-panel">
      <label class="field-label" for="input-name">你的昵称</label>
      <input id="input-name" class="big-input" maxlength="12" placeholder="输入昵称" autocomplete="off" />

      <label class="field-label" style="margin-top:18px">游戏模块</label>
      <div class="toggle-row">
        <label class="toggle"><input type="checkbox" id="opt-cities" /><span class="toggle-pill"></span><span>城市</span></label>
        <label class="toggle"><input type="checkbox" id="opt-tp" /><span class="toggle-pill"></span><span>贸易站</span></label>
      </div>

      <button id="btn-create" class="btn btn-primary btn-big">创建房间</button>
    </div>

    <div class="card-panel">
      <label class="field-label" for="input-code">加入房间</label>
      <div class="join-row">
        <input id="input-code" class="big-input code-input" maxlength="4" placeholder="房码" autocomplete="off" autocapitalize="characters" />
        <button id="btn-join" class="btn btn-primary">加入</button>
      </div>
      <p class="hint">输入 4 位房码,或直接打开朋友分享的邀请链接。</p>
    </div>
  </section>

  <!-- 房间 -->
  <section id="screen-room" class="screen hidden">
    <header class="room-head">
      <p class="field-label">房间码</p>
      <div class="room-code" id="room-code">----</div>
      <div class="room-actions">
        <button id="btn-copy-link" class="btn btn-ghost">复制邀请链接</button>
        <button id="btn-copy-code" class="btn btn-ghost">复制房码</button>
      </div>
    </header>

    <div class="card-panel">
      <p class="field-label">玩家(<span id="room-count">0</span>/4)</p>
      <ul id="room-players" class="player-list"></ul>
      <button id="btn-add-bot" class="btn btn-ghost" style="margin-top:10px; width:100%">+ 添加机器人陪玩</button>
      <p class="hint">人不够?添加机器人即可开局,机器人会自动行动。</p>
    </div>

    <div class="card-panel" id="room-options-panel">
      <p class="field-label">游戏模块(下一局生效)</p>
      <div class="toggle-row">
        <label class="toggle"><input type="checkbox" id="room-opt-cities" /><span class="toggle-pill"></span><span>城市</span></label>
        <label class="toggle"><input type="checkbox" id="room-opt-tp" /><span class="toggle-pill"></span><span>贸易站</span></label>
      </div>
    </div>

    <div class="stack">
      <button id="btn-last-result" class="btn btn-ghost hidden">查看上局结果</button>
      <button id="btn-start" class="btn btn-primary btn-big">开始游戏</button>
      <button id="btn-leave" class="btn btn-ghost">离开房间</button>
    </div>
  </section>

  <!-- 对局 -->
  <section id="screen-game" class="screen hidden">
    <div id="topbar"></div>
    <div id="opponents"></div>
    <div id="market"></div>
    <div id="game-side">
      <div id="goals"></div>
      <div id="supply"></div>
    </div>
    <div id="self-hand"></div>
    <div id="self"></div>
    <div id="actionbar"></div>
  </section>

  <!-- 卡片详情 -->
  <div id="modal" class="overlay hidden">
    <div class="modal-box" id="modal-box"></div>
  </div>

  <!-- 全屏看牌 -->
  <div id="browser" class="overlay hidden">
    <div class="browser-box" id="browser-box"></div>
  </div>

  <!-- 行动播报 -->
  <div id="banner" class="hidden"></div>

  <!-- 底部抽屉(弃置/选择) -->
  <div id="sheet" class="overlay hidden">
    <div class="sheet-box" id="sheet-box"></div>
  </div>

  <!-- 结算 -->
  <div id="result" class="overlay hidden">
    <div class="modal-box" id="result-box"></div>
  </div>

  <div id="toast" class="hidden"></div>

  <script src="/protocol.js"></script>
  <script src="/app.js"></script>
</body>
</html>
